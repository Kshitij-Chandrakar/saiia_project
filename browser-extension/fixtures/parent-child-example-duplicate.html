      <p>Given two integers, return their sum.</p>

        <h2>Example 1</h2>

        <div class="example-output">Output: 3</div>
        <div class="example-explanation">Explanation: add both values.</div>
      </section>
      <section class="code-editor">
        <textarea>function sum(a, b) {
  return a + b;
}</textarea>
      </section>
    </main>
  </body>
