  <h1>Print Array</h1>
  <p>Read the numbers and print them on one line.</p>
  <h2>Input Format</h2>
  <p>The first line contains n. The second line contains n integers.</p>
  <h2>Output Format</h2>
  <p>Print the integers separated by spaces.</p>
  <h2>Example Input</h2>
  <pre>3 1 2 3</pre>
  <h2>Example Output</h2>
  <pre>1 2 3</pre>
</main>
