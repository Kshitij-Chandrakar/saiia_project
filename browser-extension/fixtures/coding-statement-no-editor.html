    <main>
      <h1>12. Integer to Roman</h1>
      <p>Given an integer, convert it to a Roman numeral.</p>
      <section>
        <h2>Example 1</h2>
        <p>Input: num = 3749</p>
        <p>Output: "MMMDCCXLIX"</p>
      </section>
      <section>
        <h2>Constraints</h2>
        <ul>
          <li>1 &lt;= num &lt;= 3999</li>
        </ul>
      </section>
    </main>
  </body>
